<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register student · Sunday Quran Class</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%23103d2d"/><path d="M7 9c4-1 7 0 9 3 2-3 5-4 9-3v14c-4-1-7 0-9 3-2-3-5-4-9-3V9Z" fill="%23d5a84b"/></svg>'>
<style>
:root{--bg:#f5f8f7;--fg:#14231e;--green:#103d2d;--green-2:#174d39;--gold:#d5a84b;--border:#d7e3de;--muted:#5b6f67;--soft:#edf4f1;--danger:#a13a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.i{width:18px;height:18px;flex:0 0 auto}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding-left:1.25rem;padding-right:1.25rem}
@media(min-width:640px){.wrap{padding-left:2rem;padding-right:2rem}}

/* header */
.topbar{background:var(--green);color:#fff;border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-top:1.25rem;padding-bottom:1.25rem}
.brand{display:flex;align-items:center;gap:.75rem}
.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:.75rem;background:var(--gold);color:var(--green)}
.brand-mark svg{width:24px;height:24px}
.brand h1{margin:0;font-size:1.25rem;font-weight:600}
.brand p{margin:0;font-size:.875rem;color:#bcd1c9}
.top-actions{display:flex;gap:.5rem}
.primary-gold,.export-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.8rem 1rem;font-weight:700;text-decoration:none}
.primary-gold{border:0;background:var(--gold);color:#173528}
.primary-gold:disabled{opacity:.5;cursor:not-allowed}
.export-btn{border:1px solid #6e9585;background:var(--green-2);color:#fff}
.export-btn:hover{background:#1e5b44}
.sm-show{display:none}
@media(min-width:640px){.sm-show{display:inline}}

/* overview */
.content{padding-top:1.75rem;padding-bottom:2.5rem}
.overview{display:grid;gap:1rem;margin-bottom:1.5rem}
@media(min-width:768px){.overview{grid-template-columns:1fr auto;align-items:end}}
.muted-label{margin:0 0 .25rem;font-size:.875rem;font-weight:500;color:var(--muted)}
.overview h2{margin:0;font-size:1.875rem;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:.75rem}
.stat{display:flex;align-items:center;gap:.55rem;border:1px solid var(--border);border-radius:.85rem;background:#fff;padding:.7rem .9rem;font-size:.875rem;color:var(--muted)}
.stat svg{color:#2c6550}.stat strong{color:#163b2d}
.searchbar{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;border:1px solid var(--border);border-radius:1rem;background:#fff;padding:.75rem;box-shadow:0 1px 2px #0000000d}
.searchbar svg{margin-left:.25rem;color:#6f847b;width:20px;height:20px}
.searchbar input{width:100%;border:0;background:transparent;font-size:1rem;outline:none;color:var(--fg)}
.notice{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;border-radius:.75rem;background:#e4f1eb;padding:.75rem 1rem;color:#235742;font-size:.875rem}
.notice.error{background:#f8e7e5;color:#8a2f2f}

/* roster */
.empty{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;border:1px dashed #b7cbc2;border-radius:1rem;background:#fff;color:#637970;text-align:center;padding:2rem}
.empty > svg{width:34px;height:34px}
.empty h3{margin:0;color:#1a382d;font-size:1.2rem}.empty p{margin:0;max-width:420px}
.student-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media(min-width:640px){.student-roster{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.student-roster{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1200px){.student-roster{grid-template-columns:repeat(6,minmax(0,1fr))}}
.roster-card{border:1px solid var(--border);border-radius:1rem;background:#fff;padding:1rem;text-align:center;box-shadow:0 2px 10px #143b2d0a;transition:transform .15s ease,box-shadow .15s ease;color:inherit}
.roster-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #143b2d14}
.roster-card h3{margin:.8rem 0 .5rem;font-size:1rem;color:#183a2d;overflow-wrap:anywhere}
.mini-bar{height:6px;border-radius:999px;background:#e3ece8;overflow:hidden}
.mini-bar div{height:100%;background:var(--gold)}
.mini-pct{margin-top:.35rem;font-size:.8rem;color:#6b7f77}
.roster-photo,.profile-photo{overflow:hidden;border-radius:1rem;background:#dcebe5;color:#2c6550;font-weight:800}
.roster-photo{aspect-ratio:1;width:100%;font-size:1.6rem}
.roster-photo img,.profile-photo img{height:100%;width:100%;object-fit:cover;display:block}
.roster-photo span,.profile-photo span{display:grid;height:100%;place-items:center}
.pager{margin-top:1.25rem;display:flex;align-items:center;justify-content:flex-end;gap:.5rem;font-size:.875rem}
.icon-btn,.page-btn{display:grid;height:38px;width:38px;place-items:center;border:1px solid var(--border);border-radius:.7rem;background:#fff;color:#34594b;padding:0}
.icon-btn:hover,.page-btn:hover{background:#edf3f0}
.page-btn:disabled{cursor:not-allowed;opacity:.4}
.icon-btn.small{height:32px;width:32px}.icon-btn.small svg{width:15px;height:15px}
.icon-btn.danger{color:var(--danger)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0b211999;padding:1rem}
.modal{max-height:92vh;width:100%;max-width:42rem;overflow:auto;border-radius:1.5rem;background:#fff;padding:1.5rem;box-shadow:0 25px 60px #07150f66}
.modal-wide{max-width:72rem}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.modal-head p{margin:0;font-size:.875rem;font-weight:500;color:#668078}
.modal-head h2{margin:0;font-size:1.5rem;font-weight:600}
.primary-btn,.secondary-btn{display:flex;align-items:center;justify-content:center;gap:.45rem;border-radius:.75rem;padding:.8rem 1rem;font-weight:700}
.primary-btn{border:0;background:var(--green);color:#fff}
.primary-btn:disabled{cursor:wait;opacity:.6}
.secondary-btn{border:1px solid #cbdad4;background:#fff;color:#34594b}
.secondary-btn:hover{background:#f3f7f5}
.danger-text{color:var(--danger)}
.actions{display:flex;justify-content:flex-end;gap:.75rem;padding-top:.5rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}

/* forms */
form{display:grid;gap:1.25rem}
form label{display:block;font-size:.9rem;font-weight:700;color:#2d493e}
form label .opt{font-weight:400;color:#758980}
form input:not([type=range]):not([type=file]),form textarea{display:block;width:100%;margin-top:.45rem;border:1px solid #cbdad4;border-radius:.75rem;background:#fbfdfc;padding:.8rem .9rem;font:inherit;font-weight:400;color:var(--fg);resize:vertical}
.range-row{display:flex;align-items:center;gap:.75rem;margin-top:.5rem}
.range-row input{flex:1;accent-color:var(--green)}
.range-row output{width:3.5rem;border-radius:.5rem;background:var(--soft);padding:.5rem;text-align:center;font-weight:700}
.photo-picker{position:relative;display:flex;align-items:center;gap:.85rem;margin-top:.45rem;border:1px dashed #9db8ad;border-radius:.85rem;background:#f5faf8;padding:1rem;color:#28513f;cursor:pointer}
.photo-picker svg{width:22px;height:22px}
.photo-picker img{width:52px;height:52px;border-radius:.6rem;object-fit:cover}
.photo-picker p{margin:.2rem 0 0;color:#71877e;font-size:.8rem;font-weight:400}
.photo-picker input{position:absolute;inset:0;margin:0;cursor:pointer;opacity:0;width:100%}

/* profile + history */
.profile-head{display:flex;align-items:center;gap:1rem}
.profile-photo{height:88px;width:88px;flex:0 0 auto;font-size:1.35rem}
.bar-label{display:flex;justify-content:space-between;margin-bottom:.5rem;font-size:.875rem;font-weight:600}
.bar{height:10px;border-radius:999px;background:#d6e4de;overflow:hidden}
.bar div{height:100%;border-radius:999px;background:var(--gold)}
.small-muted{margin:.5rem 0 0;font-size:.875rem;color:#6b7f77}
.grid-2{display:grid;gap:.75rem;margin-top:1.25rem}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
.record{border-radius:.75rem;background:#f3f7f5;padding:.75rem}
.record span,.notes-box span{font-size:.75rem;font-weight:700;letter-spacing:.02em;color:#71877e}
.record p{margin:.3rem 0 0;color:#40554c;font-size:.875rem;line-height:1.5;white-space:pre-wrap}
.notes-box{margin-top:1.25rem;border-left:4px solid var(--gold);border-radius:.65rem;background:#fbf7ea;padding:1rem}
.notes-box span{color:#766334}
.notes-box p{margin:.35rem 0 0;white-space:pre-wrap;color:#4c493c;line-height:1.55}
.summary{margin-bottom:1.25rem;border-radius:.75rem;background:var(--soft);padding:1rem}
.history-table{overflow-x:auto;border:1px solid var(--border);border-radius:.85rem}
.history-table table{width:100%;border-collapse:collapse;font-size:.875rem}
.history-table thead{background:#e7f0ec}
.history-table th{padding:.8rem .75rem;color:#385348;text-align:left;font-weight:600;white-space:nowrap}
.history-table td{padding:.9rem .75rem;vertical-align:top;border-top:1px solid var(--border)}
.history-table tbody tr:nth-child(even){background:#f8faf9}
.history-table .r{text-align:right}
.history-table .date{min-width:120px;font-weight:600;white-space:nowrap}
.history-table .txt{min-width:200px;max-width:300px;line-height:1.5;white-space:pre-wrap}
.progress-pill{border-radius:999px;background:#eef4e5;padding:.35rem .55rem;color:#526231;white-space:nowrap}
.change{font-weight:600;color:#35634f;white-space:nowrap}
.change.neg{color:var(--danger)}
.center-muted{padding:2rem 0;text-align:center;color:#6b7f77}
@media(prefers-reduced-motion:reduce){.roster-card{transition:none}.roster-card:hover{transform:none}}

/* ---- additions for standalone pages ---- */
a{color:inherit}
.nav{background:#0c3324;border-bottom:1px solid #1d4d3b}
.nav-inner{display:flex;gap:.25rem;overflow-x:auto;padding-top:.35rem;padding-bottom:.35rem;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:.4rem;white-space:nowrap;padding:.55rem .8rem;border-radius:.6rem;color:#bcd1c9;text-decoration:none;font-size:.9rem;font-weight:600}
.nav a:hover{background:#174d39;color:#fff}
.nav a[aria-current=page]{background:var(--gold);color:#173528}
.nav svg{width:16px;height:16px}
.panel{border:1px solid var(--border);border-radius:1.25rem;background:#fff;padding:1.5rem;box-shadow:0 2px 10px #143b2d0a;max-width:46rem}
.panel.wide{max-width:none}
.page-head{margin-bottom:1.5rem}
.page-head h2{margin:0;font-size:1.875rem;font-weight:600}
.page-head p.lead{margin:.4rem 0 0;color:var(--muted);max-width:60ch;line-height:1.5}
select{display:block;width:100%;margin-top:.45rem;border:1px solid #cbdad4;border-radius:.75rem;background:#fbfdfc;padding:.8rem .9rem;font:inherit;color:var(--fg)}
.picker{max-width:28rem;margin-bottom:1.25rem}
.picker label{display:block;font-size:.9rem;font-weight:700;color:#2d493e}
a.primary-btn,a.secondary-btn{text-decoration:none}
.roster-card{display:block;text-decoration:none}
.chart{margin:0 0 1.25rem;border:1px solid var(--border);border-radius:.85rem;padding:1rem;background:#fff}
.chart svg{width:100%;height:auto;max-height:230px;display:block}
.chart h3{margin:0 0 .5rem;font-size:.95rem;color:#385348}
.tool-grid{display:grid;gap:1rem}
@media(min-width:760px){.tool-grid{grid-template-columns:1fr 1fr}}
.tool{border:1px solid var(--border);border-radius:1rem;background:#fff;padding:1.25rem}
.tool h3{margin:0 0 .35rem;font-size:1.05rem}
.tool p{margin:0 0 1rem;color:var(--muted);font-size:.9rem;line-height:1.5}
.tool.danger{border-color:#e6c3c3;background:#fdf8f8}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.meter{font-size:.85rem;color:var(--muted);margin-top:1rem}
.foot{margin-top:2.5rem;font-size:.8rem;color:#7c8f87}
@media(max-width:600px){.panel{padding:1rem;border-radius:1rem}.page-head h2{font-size:1.5rem}}

.panel.example{position:relative;border-style:dashed;border-color:#b7cbc2}
.example-tag{position:absolute;top:1rem;right:1rem;border-radius:999px;background:#fbf0d4;color:#6d5418;padding:.25rem .65rem;font-size:.75rem;font-weight:700}

/* 30 juz */
.juz-grid{display:grid;grid-template-columns:1fr;gap:.35rem 1.25rem;margin-top:.5rem}
@media(min-width:480px){.juz-grid{grid-template-columns:1fr 1fr;grid-template-rows:repeat(15,auto);grid-auto-flow:column}}
@media(min-width:900px){.juz-grid{grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(10,auto)}}
.juz-row{display:grid;grid-template-columns:3.3rem 1fr 2.6rem;align-items:center;gap:.5rem;font-size:.8rem;color:#4f645b}
.juz-row .jn{font-weight:600}.juz-row .jp{text-align:right;font-variant-numeric:tabular-nums}
.jb{height:8px;border-radius:999px;background:#e3ece8;overflow:hidden}
.jb div{height:100%;border-radius:999px;background:#e2c27f;transition:width .15s}
.full .jb div{background:var(--gold)}
.full .jn,.full .jp{color:#173528;font-weight:700}
.juz-strip{display:flex;gap:2px;height:14px;align-items:flex-end}
.juz-strip i{flex:1;height:100%;background:#e3ece8;border-radius:1px;display:flex;align-items:flex-end;overflow:hidden}
.juz-strip b{display:block;width:100%;background:var(--gold)}
fieldset.juz-edit{border:1px solid #cbdad4;border-radius:.85rem;padding:1rem;margin:0;min-width:0}
fieldset.juz-edit legend{font-size:.9rem;font-weight:700;color:#2d493e;padding:0 .35rem}
.juz-edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem}
form label.je{display:grid;grid-template-columns:minmax(0,1fr) 3.6rem;min-width:0;gap:.35rem .4rem;align-items:center;border:1px solid var(--border);border-radius:.65rem;padding:.5rem .55rem;background:#fbfdfc;font-weight:400}
form label.je.full{border-color:#e2c27f;background:#fdf8ec}
.je-name{min-width:0;white-space:nowrap;border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:.82rem;color:#2d493e;line-height:1.2}
.je-name small{display:block;font-weight:400;font-size:.7rem;color:#7c8f87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
form label.je input{width:100%;min-width:0;margin:0!important;padding:.4rem .45rem!important;text-align:right;font-variant-numeric:tabular-nums}
.je .jb{grid-column:1/-1;height:5px}
.rec-date{display:block;margin-top:.35rem;font-size:.75rem;color:#71877e}
.juz-changes{font-size:.8rem;color:#4f645b;line-height:1.5}

.juz-row{position:relative;border-radius:.35rem;outline-offset:2px;cursor:default}
.juz-row[data-tip]:hover::after,.juz-row[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);z-index:5;white-space:nowrap;background:#103d2d;color:#fff;font-size:.75rem;font-weight:600;padding:.35rem .55rem;border-radius:.45rem;box-shadow:0 6px 16px #07150f40;pointer-events:none}
.je-rev{grid-column:1/-1;display:flex;align-items:center;gap:.35rem;font-size:.75rem;color:#4f645b}
form label.je .je-rev input{width:auto;margin:0!important;padding:0!important;accent-color:var(--green)}
.je-rev em{margin-left:auto;font-style:normal;color:#8a9b94;font-size:.7rem}

.danger-btn{display:flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:.75rem;padding:.8rem 1rem;font-weight:700;background:#b42318;color:#fff}
.danger-btn:hover{background:#912018}

.field-row{display:grid;gap:1.25rem}
@media(min-width:560px){.field-row{grid-template-columns:1fr 1fr}}
form label select{margin-top:.45rem}
/* roster table */
.table-card{margin-bottom:1.5rem;border:1px solid var(--border);border-radius:1rem;background:#fff;overflow:hidden;box-shadow:0 2px 10px #143b2d0a}
.table-card-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.table-card-head h3{margin:0;font-size:1rem;color:#183a2d}
.table-card-head p{margin:0;font-size:.8rem;color:#6b7f77}
.table-scroll{overflow-x:auto}
.student-table{width:100%;border-collapse:collapse;font-size:.875rem}
.student-table th{background:#e7f0ec;color:#385348;text-align:left;font-weight:600;padding:.6rem .9rem;white-space:nowrap}
.student-table td{padding:.5rem .9rem;border-top:1px solid #e6eeea;white-space:nowrap;color:#2d493e}
.student-table tbody tr:nth-child(even){background:#f8faf9}
.student-table tbody tr.link{cursor:pointer}
.student-table tbody tr.link:hover{background:#eef5f1}
.student-table .who{display:flex;align-items:center;gap:.6rem;font-weight:600;color:#183a2d}
.student-table .who a{text-decoration:none}
.student-table .who a:hover{text-decoration:underline}
.mini-av{width:28px;height:28px;flex:0 0 auto;border-radius:.45rem;overflow:hidden;background:#dcebe5;color:#2c6550;font-size:.7rem;font-weight:800;display:grid;place-items:center}
.mini-av img{width:100%;height:100%;object-fit:cover}
.rel{display:inline-block;border-radius:999px;padding:.15rem .55rem;font-size:.75rem;font-weight:700;background:#eef2f0;color:#4f645b}
.rel.Father{background:#e4f1eb;color:#235742}.rel.Mother{background:#fbf0d4;color:#6d5418}.rel.Self{background:#e8eef8;color:#2f4a78}
.student-table td a[href^="tel"]{color:#235742;text-decoration:none;font-variant-numeric:tabular-nums}
.section-title{margin:0 0 .75rem;font-size:1rem;color:#183a2d}

.roster-top{margin-bottom:1.25rem}
.roster-tools{display:flex;flex-wrap:nowrap;align-items:stretch;gap:.6rem}.roster-tools .stat{flex:0 0 auto;white-space:nowrap}
.roster-tools .searchbar{margin:0;flex:1 1 auto;min-width:0;padding:.55rem .75rem;border-radius:.85rem}
@media(min-width:768px){.roster-top{grid-template-columns:auto 1fr}.roster-tools{justify-content:flex-end}.roster-tools .searchbar{flex:0 1 26rem}}
.hifdh{display:flex;align-items:center;gap:.5rem;min-width:7.5rem}
.hifdh span{width:2.6rem;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:#183a2d}
.hifdh .jb{flex:1;height:6px}

/* ================= Capture pages (Hifdh / Murajah) ================= */
:root{--arabic:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","KFGQPC Uthmanic Script HAFS","Geeza Pro","Traditional Arabic","Arabic Typesetting",serif}
[lang=ar]{font-family:var(--arabic)}
.ar-title{font-family:var(--arabic);font-weight:400;font-size:1.35rem;color:#8a6a1f;margin-left:.5rem}
kbd{font-family:inherit;font-size:.82em;border:1px solid #cbdad4;border-bottom-width:2px;border-radius:.35rem;padding:.05rem .35rem;background:#fff;color:#2d493e}
.capture .panel{max-width:none;margin-bottom:1rem}
.capture-grid{display:grid;gap:0 1rem}
@media(min-width:1000px){.capture-grid{grid-template-columns:minmax(0,1fr) 22rem}.sticky{position:sticky;top:1rem}}
.student-strip{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.25rem}
.profile-photo.sm{width:56px;height:56px;border-radius:.8rem;font-size:1rem}
.strip-main{flex:1 1 14rem;display:flex;flex-direction:column;gap:.15rem}
.strip-main strong{font-size:1.1rem}
.strip-stat{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.strip-stat strong{font-size:1.4rem;color:#103d2d}.strip-stat span{font-size:.75rem;color:#6b7f77}
.cont{padding:.7rem 1rem}
.block-title{margin:1.25rem 0 .75rem;font-size:1rem;color:#183a2d}
.panel > .block-title:first-child{margin-top:0}
.row-2{display:grid;gap:1rem;max-width:18rem}
.add-portion{margin-top:.25rem}

/* portion */
.portion{border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.9rem;background:#fbfdfc;display:grid;gap:.85rem}
.portion-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.portion-no{font-weight:700;color:#2d493e;font-size:.9rem;margin-right:auto}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #cbdad4;border-radius:.75rem;background:#fff;padding:3px;gap:3px}
.seg-opt{position:relative;display:block;cursor:pointer;font-weight:600!important}
.seg-opt input{position:absolute;opacity:0;pointer-events:none}

<body data-page="register.html">
<header class="topbar"><div class="wrap topbar-inner">
  <a class="brand" href="index.html" style="text-decoration:none">
    <div class="brand-mark" data-icon="book"></div>
    <div><h1>Sunday Quran Class</h1><p>Hifdh registration &amp; progress</p></div>
  </a>
  <a class="primary-gold" href="register.html" aria-label="Register student"><span data-icon="plus"></span><span class="sm-show">Register student</span></a>
</div></header>
<nav class="nav" aria-label="Pages"><div class="wrap nav-inner" id="nav"></div></nav>
<main class="wrap content">
<div class="page-head"><h2>Register student</h2><p class="lead">Add a new student to the class. You can record their first Sunday now or later from the Sunday entry page.</p></div>
<div id="notice" role="status" class="notice" hidden></div>
<div class="panel">
<form id="form" novalidate>
  <label>Name<input name="name" required maxlength="80" autocomplete="off"></label>
  <label>Student picture <span class="opt">(optional)</span>
    <div class="photo-picker"><span id="thumb" data-icon="camera"></span>
      <div><strong id="pname">Take or choose a photo</strong><p>Use your phone camera or photo library</p></div>
      <input name="photo" type="file" accept="image/*" capture="environment" aria-label="Take or choose student photo">
    </div></label>
  <div id="contactSlot"></div>
  <label>Teacher notes and comments <span class="opt">(optional)</span><textarea name="notes" rows="3" maxlength="2000" placeholder="Parent contact, tajweed focus, anything worth remembering…"></textarea></label>
  <label>Date started <span class="opt">(first Sunday)</span><input name="date" type="date" required></label>
  <label>New memorisation <span class="opt">(optional)</span><textarea name="mem" rows="2" maxlength="500" placeholder="Example: Surah Al-Mulk, verses 1–5"></textarea></label>
  <label>Revision <span class="opt">(optional)</span><textarea name="rev" rows="2" maxlength="500" placeholder="Example: Surah An-Naba and An-Nazi'at"></textarea></label>
  <div id="juzSlot"></div>
  <div class="actions"><button type="reset" class="secondary-btn">Clear</button><button class="primary-btn" type="submit">Register student</button></div>
</form>
</div>

<p class="foot">Records are stored in this browser on this device. Use <a href="backup.html">Backup</a> to keep a copy.</p>
</main>
<script>
// ===== Shared code (inlined into every page) =====
const KEY = "hifdh-tracker-v1", MAX = 100, PER_PAGE = 12;

const ICONS = {
  book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  user:'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  save:'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const initials = (n) => n.split(/\s+/).filter(Boolean).map((x) => x[0]).join("").slice(0, 2).toUpperCase();
const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
const avatar = (s) => s.photo ? `<img src="${esc(s.photo)}" alt="">` : `<span>${esc(initials(s.name))}</span>`;
const param = (k) => new URLSearchParams(location.search).get(k);
const clamp = (v) => Math.max(0, Math.min(100, Math.round(Number(v)) || 0));
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

// ---------- storage (browser localStorage, shared by all pages in this folder) ----------
const emptyDB = () => ({ version: 1, seq: 1, students: [], sessions: [] });
function loadDB() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.students)) return migrate(d); } catch {}
  return emptyDB();
}

// ---------- 30 juz ----------
const JUZ_NAMES = ["Alif Lam Mim","Sayaqul","Tilka ar-Rusul","Lan Tanalu","Wal-Muhsanat","La Yuhibbullah","Wa Idha Sami'u",
  "Wa Law Annana","Qal al-Mala'","Wa'lamu","Ya'tadhirun","Wa Ma Min Dabbah","Wa Ma Ubarri'u","Rubama","Subhanalladhi",
  "Qal Alam","Iqtaraba","Qad Aflaha","Wa Qalalladhina","Amman Khalaq","Utlu Ma Uhiya","Wa Man Yaqnut","Wa Mali",
  "Fa Man Azlam","Ilayhi Yuradd","Ha Mim","Qala Fa Ma Khatbukum","Qad Sami'allah","Tabarakalladhi","'Amma"];
const zeroJuz = () => Array(30).fill(0);
const cleanJuz = (a) => Array.from({ length: 30 }, (_, i) => clamp(a?.[i]));
const overall = (j) => Math.round(j.reduce((t, v) => t + v, 0) / 30);
const juzDone = (j) => j.filter((v) => v >= 100).length;
// Older records only had one overall %. Convert it the way most classes memorise: from Juz 30 backwards.
function juzFromPct(p) {
  const a = zeroJuz(); let n = (clamp(p) * 30) / 100;
  for (let k = 29; k >= 0 && n > 0.001; k--) { const v = Math.min(1, n); a[k] = Math.round(v * 100); n -= v; }
  return a;
}
function migrate(d) {
  for (const e of d.sessions) {
    e.juz = Array.isArray(e.juz) ? cleanJuz(e.juz) : juzFromPct(e.pct); e.pct = overall(e.juz);
    e.revJuz = Array.isArray(e.revJuz) ? [...new Set(e.revJuz.filter((i) => Number.isInteger(i) && i >= 0 && i < 30))].sort((a, b) => a - b) : [];
  }
  return d;
}
function saveDB(db) {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch { notify("Browser storage is full. Remove some photos or export a backup and clear old data.", true); return false; }
}
const nextId = (db) => db.seq++;

// Student with derived "latest" fields from their most recent session by date.
function sessionsFor(db, id) {
  return db.sessions.filter((e) => e.studentId === id).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
}
function view(db, s) {
  const list = sessionsFor(db, s.id), l = list[0];
  const m = list.find((e) => e.mem), r = list.find((e) => e.rev);   // most recent entry that has each activity
  const juz = l?.juz || zeroJuz();
  const revDates = Array.from({ length: 30 }, (_, i) => list.find((e) => e.revJuz?.includes(i))?.date || "");
  const startDate = s.startDate || list.at(-1)?.date || (s.createdAt || "").slice(0, 10);
  return { ...s, phone: s.phone || "", contact: s.contact || "", startDate, count: list.length, latestDate: l?.date || "", juz, revDates, pct: overall(juz),
    latestMem: m?.mem || "", latestMemDate: m?.date || "", latestRev: r?.rev || "", latestRevDate: r?.date || "" };
}
function students(db) {
  return db.students.map((s) => view(db, s)).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
}
function findStudent(db, id) { const s = db.students.find((x) => x.id === Number(id)); return s ? view(db, s) : null; }

// ---------- photos: resized in-browser to a small JPEG data URL ----------
async function photoToDataUrl(file, max = 320) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && file.type) throw new Error("Use a JPEG, PNG or WebP photo.");
  if (file.size > 15 * 1024 * 1024) throw new Error("That photo is too large.");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Could not read that photo.")); i.src = url; });
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  } finally { URL.revokeObjectURL(url); }
}

// ---------- UI chrome ----------
const PAGES = [
  ["index.html", "Roster", "grid"], ["register.html", "Register student", "plus"],
  ["profile.html", "Student profile", "user"], ["progress.html", "Hifdh progress", "book"], ["murajah.html", "Murajah progress", "history"],
  ["history.html", "History", "calendar"], ["backup.html", "Backup", "save"],
];
function chrome(active) {
  storageCheck();
  document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = icon(el.dataset.icon)));
  const id = param("id");
  $("#nav").innerHTML = PAGES.map(([href, label, ic]) => {
    const withId = id && ["profile.html", "progress.html", "murajah.html", "history.html"].includes(href) ? `${href}?id=${id}` : href;
    return `<a href="${withId}" ${href === active ? 'aria-current="page"' : ""}>${icon(ic)}${label}</a>`;
  }).join("");
  $("#nav [aria-current]")?.scrollIntoView({ block: "nearest", inline: "center" });
}
function notify(msg, isError = false) {
  const n = $("#notice"); if (!n) return alert(msg);
  n.hidden = false; n.className = "notice" + (isError ? " error" : "");
  n.innerHTML = icon(isError ? "alert" : "check") + `<span>${msg}</span>`;
  clearTimeout(notify.t); if (!isError) notify.t = setTimeout(() => (n.hidden = true), 6000);
}
// Student <select> used by profile / progress / history pages.
function studentPicker(db, selectedId, onPick) {
  const el = $("#picker"); const list = students(db);
  if (!list.length) { el.innerHTML = ""; return null; }
  el.innerHTML = `<label>Student<select id="pickSel"><option value="">Choose a student…</option>${
    list.map((s) => `<option value="${s.id}" ${s.id === Number(selectedId) ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>`;
  $("#pickSel").addEventListener("change", (e) => {
    const url = new URL(location.href);
    e.target.value ? url.searchParams.set("id", e.target.value) : url.searchParams.delete("id");
    history.replaceState(null, "", url); chrome(document.body.dataset.page); onPick(e.target.value);
  });
  return list;
}

// Four sample students with a few weeks of history (used by Backup and every empty page).
function addDemoStudents() {
  const db = loadDB(), now = new Date().toISOString();
  const demo = [
    ["Yusuf Ahmed|+44777799999|Father", "Strong tajweed; needs to slow down on madd.", [["2026-08-30","An-Naba 1–20","Al-Fajr to An-Nas",8],["2026-09-06","An-Naba 21–40","Al-Ghashiyah to An-Nas",9],["2026-09-13","An-Nazi'at 1–26","An-Naba",10],["2026-09-20","An-Nazi'at 27–46","An-Naba",12]]],
    ["Musa Khan|+44 7700 900214|Mother", "Very consistent. Parents keen on weekly updates.", [["2026-09-06","Al-Mulk 1–10","Juz 'Amma complete",12],["2026-09-13","Al-Mulk 11–20","Al-Mulk 1–10",13],["2026-09-20","Al-Mulk 21–30","Al-Mulk 1–20",14]]],
    ["Ibrahim Siddiqui|+44 7700 900358|Father", "", [["2026-09-13","Al-A'la 1–19","Al-Fil to An-Nas",3]]],
    ["Ayaan Rahman|+44 7700 900471|Mother", "Joined this term.", []],
  ];
  if (db.students.length + demo.length > MAX) return notify("Not enough room in the class for demo students.", true), false;
  for (const [who, notes, list] of demo) {
    const [name, phone, contact] = who.split("|");
    const id = nextId(db); db.students.push({ id, name, phone, contact, startDate: list[0]?.[0] || today(), photo: "", notes, createdAt: now });
    for (const [date, mem, rev, pct] of list) {
      const juz = juzFromPct(pct), revJuz = /Mulk/.test(rev) ? [28] : [29];
      db.sessions.push({ id: nextId(db), studentId: id, date, mem, rev, juz, revJuz, pct: overall(juz), createdAt: now });
    }
  }
  return saveDB(db);
}
const noStudents = () => `<div class="empty">${icon("users")}<h3>No students registered yet</h3>
  <p>Register your first student, or load four demo students to try every page.</p>
  <div class="btn-row" style="justify-content:center;margin-top:.5rem">
    <a class="primary-btn" href="register.html">${icon("plus")} Register student</a>
    <button type="button" class="secondary-btn" data-demo>${icon("users")} Load demo students</button></div></div>`;
document.addEventListener("click", (e) => {
  if (!e.target.closest("[data-demo]")) return;
  if (!addDemoStudents()) return;
  const first = [...students(loadDB())].sort((a, b) => b.count - a.count)[0];
  if (first && document.querySelector("#picker") && !param("id")) {
    const url = new URL(location.href); url.searchParams.set("id", first.id); history.replaceState(null, "", url); chrome(document.body.dataset.page);
  }
  if (typeof refresh === "function") refresh();
  notify(`Demo students loaded${first ? ` — showing ${esc(first.name)}. Use the Student list to switch.` : "."}`);
});

// Warn when the browser won't share (or keep) data between these local files.
function storageCheck() {
  let ok = true;
  try { localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); } catch { ok = false; }
  const isolated = location.protocol === "file:" && /firefox/i.test(navigator.userAgent);
  if (ok && !isolated) return;
  const bar = document.createElement("div");
  bar.className = "notice error"; bar.setAttribute("role", "alert");
  bar.innerHTML = icon("alert") + (ok
    ? "<span>Firefox keeps a separate store for each local file, so students added on one page won't appear on the others. Open these files in Chrome, Edge or Safari, or run <code>node serve.js</code> in this folder and use http://localhost:8080.</span>"
    : "<span>This browser is blocking storage for local files, so nothing can be saved. Try Chrome or Edge, turn off private browsing, or run <code>node serve.js</code> in this folder and use http://localhost:8080.</span>");
  document.querySelector("main")?.prepend(bar);
}
const revTip = (i, d) => `Juz ${i + 1} · ${d ? `Last revised ${fmtDate(d)}` : "Not revised yet"}`;
// Overall summary line + 30 bars, one per juz. Tooltip (hover, keyboard focus or tap) = last revised date.
function juzBlock(juz, revDates = []) {
  const done = juzDone(juz);
  return `<div class="bar-label"><span>Quran memorisation completed</span><span>${overall(juz)}% · ${done} of 30 juz</span></div>
  <div class="juz-grid">${juz.map((v, i) => `
    <div class="juz-row ${v >= 100 ? "full" : ""}" tabindex="0" data-tip="${revTip(i, revDates[i])}" aria-label="Juz ${i + 1}: ${v}% memorised. ${revTip(i, revDates[i])}">
      <span class="jn">Juz ${i + 1}</span><div class="jb"><div style="width:${v}%"></div></div><span class="jp">${v}%</span></div>`).join("")}</div>`;
}
// Compact 30-segment strip (roster cards).
const juzStrip = (juz) => `<div class="juz-strip" aria-hidden="true">${juz.map((v) => `<i><b style="height:${v}%"></b></i>`).join("")}</div>`;
// Form editor: one input per juz, prefilled with the last entry.
function juzEditor(juz, revDates = []) {
  return `<fieldset class="juz-edit"><legend>Memorisation completed per juz <span class="opt">(%, tap a juz name to toggle 0 / 100; tick the juz revised today)</span></legend>
    <div class="juz-edit-grid">${juz.map((v, i) => `
      <label class="je"><button type="button" class="je-name" data-toggle="${i}" title="${revTip(i, revDates[i])}">Juz ${i + 1}<small>${JUZ_NAMES[i]}</small></button>
        <input type="number" name="j${i}" min="0" max="100" step="5" value="${v}" inputmode="numeric" aria-label="Juz ${i + 1} percent">
        <div class="jb"><div style="width:${v}%"></div></div>
        <span class="je-rev"><input type="checkbox" name="r${i}" aria-label="Juz ${i + 1} revised today"> Revised<em>${revDates[i] ? fmtDate(revDates[i]) : "never"}</em></span></label>`).join("")}</div>
    <p class="small-muted" id="juzTotal">Overall ${overall(juz)}% · ${juzDone(juz)} of 30 juz complete</p></fieldset>`;
}
function wireJuzEditor(form) {
  const read = () => Array.from({ length: 30 }, (_, i) => clamp(form[`j${i}`].value));
  const update = () => {
    const j = read();
    form.querySelectorAll(".je").forEach((el, i) => { el.querySelector(".jb div").style.width = j[i] + "%"; el.classList.toggle("full", j[i] >= 100); });
    $("#juzTotal", form).textContent = `Overall ${overall(j)}% · ${juzDone(j)} of 30 juz complete`;
  };
  form.querySelectorAll(".je input").forEach((inp) => {
    inp.addEventListener("input", update);
    inp.addEventListener("change", () => { inp.value = clamp(inp.value); update(); });
  });
  form.querySelectorAll("[data-toggle]").forEach((b) => (b.onclick = () => {
    const inp = form[`j${b.dataset.toggle}`]; inp.value = Number(inp.value) >= 100 ? 0 : 100; update();
  }));
  update();
  return read;
}
const readRevJuz = (form) => Array.from({ length: 30 }, (_, i) => i).filter((i) => form[`r${i}`].checked);
const CONTACTS = ["Father", "Mother", "Self"];
const cleanPhone = (v) => String(v ?? "").replace(/[^\d+ ()-]/g, "").trim().slice(0, 20);
const cleanContact = (v) => (CONTACTS.includes(v) ? v : "");
const telLink = (p) => p ? `<a href="tel:${esc(p.replace(/[^\d+]/g, ""))}">${esc(p)}</a>` : "—";
// Contact number / who to contact / date started — shared by Register and Edit forms.
const contactFields = (s = {}) => `<div class="field-row">
  <label>Contact number <span class="opt">(optional)</span><input name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="+44 7700 900123" value="${esc(s.phone)}"></label>
  <label>Contact <span class="opt">(who to call)</span><select name="contact"><option value="">Not set</option>${
    CONTACTS.map((c) => `<option ${s.contact === c ? "selected" : ""}>${c}</option>`).join("")}</select></label></div>`;
const withDate = (text, date) => text ? `${esc(text)}<small class="rec-date">${fmtDate(date)}</small>` : "No entry yet";

// Refresh when another tab/page changes the data.
window.addEventListener("storage", (e) => { if (e.key === KEY && typeof refresh === "function") refresh(); });


chrome("register.html");
// ===== Page: Register student =====
const form = $("#form");
form.querySelector("[type=submit]").innerHTML = `${icon("plus")} Register student`;
$("#contactSlot").outerHTML = contactFields();
form.date.value = today();
$("#juzSlot").outerHTML = juzEditor(zeroJuz());
let readJuz = wireJuzEditor(form);
let photo = "";
form.photo.addEventListener("change", async () => {
  const f = form.photo.files[0]; if (!f) return;
  try { photo = await photoToDataUrl(f); $("#thumb").innerHTML = `<img src="${photo}" alt="">`; $("#pname").textContent = f.name; }
  catch (e) { photo = ""; notify(e.message, true); }
});
form.addEventListener("reset", () => setTimeout(() => {
  photo = ""; $("#thumb").innerHTML = icon("camera"); $("#pname").textContent = "Take or choose a photo";
  form.date.value = today(); readJuz = wireJuzEditor(form);
}));
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const db = loadDB(), f = Object.fromEntries(new FormData(form));
  const name = f.name.trim().slice(0, 80);
  if (db.students.length >= MAX) return notify(`The class is limited to ${MAX} students.`, true);
  if (!name) return notify("Please enter the student's name.", true), form.name.focus();
  if (!DATE_RE.test(f.date)) return notify("Please choose the first Sunday date.", true);
  if (db.students.some((s) => s.name.toLowerCase() === name.toLowerCase()) && !confirm(`A student called ${name} already exists. Register another with the same name?`)) return;
  const id = nextId(db), now = new Date().toISOString();
  db.students.push({ id, name, photo, phone: cleanPhone(f.phone), contact: cleanContact(f.contact), startDate: f.date, notes: f.notes.trim().slice(0, 2000), createdAt: now });
  const mem = f.mem.trim(), rev = f.rev.trim();
  const juz = readJuz();
  const revJuz = readRevJuz(form);
  if (mem || rev || revJuz.length || juz.some((v) => v > 0)) db.sessions.push({ id: nextId(db), studentId: id, date: f.date, mem, rev, juz, revJuz, pct: overall(juz), createdAt: now });
  if (!saveDB(db)) return;
  form.reset();
  notify(`${esc(name)} registered. <a href="profile.html?id=${id}">View profile</a> · <a href="progress.html?id=${id}">Add Sunday entry</a>`);
  window.scrollTo({ top: 0, behavior: "smooth" });
});
